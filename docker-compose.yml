services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-academic_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./exports/retrieval:/seed/retrieval:ro
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-academic_platform}
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:3b}
      - WORKER_MODEL_NAME=${WORKER_MODEL_NAME:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-base}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_CANDIDATE_K=${RAG_CANDIDATE_K:-25}
      - RAG_RETRIEVAL_MODE=${RAG_RETRIEVAL_MODE:-hybrid}
      - RAG_VECTOR_TOP_K=${RAG_VECTOR_TOP_K:-25}
      - RAG_BM25_TOP_K=${RAG_BM25_TOP_K:-25}
      - RAG_FINAL_TOP_K=${RAG_FINAL_TOP_K:-5}
      - RAG_FUSION_METHOD=${RAG_FUSION_METHOD:-rrf}
      - RAG_RRF_K=${RAG_RRF_K:-60}
      - RAG_WEIGHTED_ALPHA=${RAG_WEIGHTED_ALPHA:-0.65}
      - RAG_BM25_INDEX_PATH=${RAG_BM25_INDEX_PATH:-exports/retrieval/articles_bm25.sqlite}
      - RAG_DEBUG_RETRIEVAL=${RAG_DEBUG_RETRIEVAL:-false}
      - RAG_RERANKER_ENABLED=false
      - RAG_RERANKER_MODEL_NAME=${RAG_RERANKER_MODEL_NAME:-cross-encoder/ms-marco-TinyBERT-L2-v2}
      - RAG_RERANKER_TOP_N=${RAG_RERANKER_TOP_N:-50}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:-12}
      - CHAT_SUMMARY_TRIGGER_MESSAGES=${CHAT_SUMMARY_TRIGGER_MESSAGES:-24}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5173}
      - TELEGRAM_LINK_TOKEN_TTL_MINUTES=${TELEGRAM_LINK_TOKEN_TTL_MINUTES:-30}
    volumes:
      - ./exports/retrieval:/app/exports/retrieval
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: worker
    command: celery -A backend.worker.scheduler.app worker --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-academic_platform}
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=${WORKER_MODEL_NAME:-${MODEL_NAME:-qwen2.5:3b}}
      - RAG_RERANKER_ENABLED=false
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5173}
      - TELEGRAM_LINK_TOKEN_TTL_MINUTES=${TELEGRAM_LINK_TOKEN_TTL_MINUTES:-30}
    volumes:
      - ./exports/retrieval:/app/exports/retrieval
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beat
    command: celery -A backend.worker.scheduler.app beat --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-academic_platform}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /scripts/ollama-pull.sh
    volumes:
      - ./docker/ollama-pull.sh:/scripts/ollama-pull.sh:ro
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    profiles:
      - telegram
    env_file:
      - path: .env
        required: true
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command:
      - http
      - http://backend:8000
      - --log=stdout
    ports:
      - "4040:4040"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  telegram-webhook:
    image: python:3.11-alpine
    container_name: telegram-webhook
    profiles:
      - telegram
    env_file:
      - path: .env
        required: true
    environment:
      - BACKEND_HEALTH_URL=http://backend:8000/health
      - NGROK_API_URL=http://ngrok:4040/api/tunnels
      - TELEGRAM_WEBHOOK_PATH=/integrations/telegram/webhook
    command: python /scripts/telegram-webhook-setup.py
    volumes:
      - ./docker/telegram-webhook-setup.py:/scripts/telegram-webhook-setup.py:ro
    depends_on:
      backend:
        condition: service_started
      ngrok:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  ollama_data:
